# Installazione, una volta: `make setup` (oppure `uv run --directory backend pre-commit install`).
# Gli strumenti sono quelli già installati nei due progetti: stesse versioni della CI.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --directory backend ruff format
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: uv run --directory backend ruff check --fix
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: prettier
        name: prettier
        entry: npm --prefix frontend run -s format
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: eslint
        name: eslint
        entry: npm --prefix frontend run -s lint
        language: system
        files: ^frontend/.*\.(ts|vue)$
        pass_filenames: false
      - id: no-large-files
        name: niente file oltre 500 kB
        entry: bash -c 'for f in "$@"; do [ "$(wc -c < "$f")" -le 512000 ] || { echo "$f supera 500 kB"; exit 1; }; done' --
        language: system
        exclude: ^(frontend/package-lock\.json|backend/uv\.lock)$
