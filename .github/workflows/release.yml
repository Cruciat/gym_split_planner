name: Rilascio

# Parte con un tag vX.Y.Z su main (ADR 0010). Procedura in CLAUDE.md, sezione "Rilasci".
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Immagine su GHCR e release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Versioni coerenti con il tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          py=$(grep -m1 '^version = ' backend/pyproject.toml | cut -d'"' -f2)
          js=$(node -p "require('./frontend/package.json').version")
          echo "tag=$tag pyproject=$py package.json=$js"
          if [ "$tag" != "$py" ] || [ "$tag" != "$js" ]; then
            echo "::error::Il tag $tag non coincide con le versioni del progetto ($py, $js)"
            exit 1
          fi
          if ! grep -q "^## \[$tag\]" CHANGELOG.md; then
            echo "::error::Manca la sezione [$tag] in CHANGELOG.md"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag dell'immagine
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/cruciat/gym_split_planner
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build e pubblicazione
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Release su GitHub con le note del CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v t="$tag" '$0 ~ "^## \\[" t "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
