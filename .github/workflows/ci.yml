name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Librerie di sistema per WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
      - name: Dipendenze
        run: uv sync --locked
      - name: Formattazione (ruff)
        run: uv run ruff format --check .
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Tipi (mypy)
        run: uv run mypy
      - name: Confini degli strati (import-linter)
        run: uv run lint-imports
      - name: Test con copertura
        run: uv run pytest --cov --cov-report=term
      - name: Copertura del dominio ≥ 90%
        run: uv run coverage report --include="src/gym_split_planner/domain/*" --fail-under=90

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dipendenze
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Formattazione (prettier)
        run: npm run format:check
      - name: Tipi (vue-tsc)
        run: npm run type-check
      - name: Test (vitest)
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Librerie di sistema per WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
      - name: Dipendenze
        run: |
          (cd backend && uv sync --locked)
          (cd frontend && npm ci && npx playwright install --with-deps chromium)
      - name: Test end-to-end
        run: make e2e
      - name: Rapporto di Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  api-contract:
    name: Contratto API allineato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Schema OpenAPI dal backend
        working-directory: backend
        run: |
          uv sync --locked
          uv run python -m gym_split_planner openapi > ../openapi.json
      - name: Tipi del client dallo schema
        working-directory: frontend
        run: |
          npm ci
          npm run api:types
      - name: Nessuna differenza con i file versionati
        run: |
          if ! git diff --exit-code -- openapi.json frontend/src/api/schema.d.ts; then
            echo "::error::Schema o tipi del client non aggiornati: esegui 'make api-types' e fai commit."
            exit 1
          fi

  docker:
    name: Immagine Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build (senza pubblicare)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: gym_split_planner:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Prova di avvio del container
        run: |
          # Come il Compose dell'homelab (ADR-041 del monorepo): cartella dei dati
          # di root, passo di avvio che la assegna all'utente dell'app, poi l'app
          # con filesystem di sola lettura e senza capability.
          sudo mkdir -p /srv/gsp-data
          docker run --rm --user 0:0 --entrypoint chown -v /srv/gsp-data:/data \
            gym_split_planner:ci 10001:10001 /data
          docker run -d --name gsp --health-interval=2s \
            --read-only --tmpfs /tmp -e XDG_CACHE_HOME=/tmp/cache \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -v /srv/gsp-data:/data \
            gym_split_planner:ci
          status=starting
          for _ in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' gsp)
            [ "$status" = healthy ] && break
            sleep 2
          done
          docker logs gsp
          if [ "$status" != healthy ]; then
            echo "::error::Il container non è diventato healthy (stato: $status)"
            exit 1
          fi
          echo "Utente del processo: $(docker exec gsp id -u)"
          docker exec gsp sh -c '[ "$(id -u)" = 10001 ]'
          docker exec gsp python -c "import json, urllib.request; print(json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health')))"
          docker exec gsp python -c "import urllib.request; assert b'id=\"app\"' in urllib.request.urlopen('http://127.0.0.1:8000/schede/1').read()"
          docker exec gsp test -f /data/gym_split_planner.db
          docker exec gsp python -c "import sqlite3; n = sqlite3.connect('/data/gym_split_planner.db').execute('select count(*) from exercise').fetchone()[0]; print('esercizi:', n); assert n == 81"
          docker logs gsp 2>&1 | grep -q "Dati iniziali caricati"
          docker exec gsp sh -c 'ls /data/backups/gym_split_planner-*.db'
          docker exec gsp python -c "import urllib.request; r = urllib.request.urlopen('http://127.0.0.1:8000/api/pdf/test'); assert r.headers['Content-Type'] == 'application/pdf' and r.read(5) == b'%PDF-'"
          if docker logs gsp 2>&1 | grep -q "HarfBuzz-Subset"; then
            echo "::error::Nell'immagine manca HarfBuzz-Subset, richiesta da WeasyPrint"
            exit 1
          fi
