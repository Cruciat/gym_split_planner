name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Dipendenze
        run: uv sync --locked
      - name: Formattazione (ruff)
        run: uv run ruff format --check .
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Tipi (mypy)
        run: uv run mypy
      - name: Confini degli strati (import-linter)
        run: uv run lint-imports
      - name: Test con copertura
        run: uv run pytest --cov --cov-report=term
      - name: Copertura del dominio ≥ 90%
        run: uv run coverage report --include="src/gym_split_planner/domain/*" --fail-under=90

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dipendenze
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Formattazione (prettier)
        run: npm run format:check
      - name: Tipi (vue-tsc)
        run: npm run type-check
      - name: Test (vitest)
        run: npm test
      - name: Build
        run: npm run build

  api-contract:
    name: Contratto API allineato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Schema OpenAPI dal backend
        working-directory: backend
        run: |
          uv sync --locked
          uv run python -m gym_split_planner openapi > ../openapi.json
      - name: Tipi del client dallo schema
        working-directory: frontend
        run: |
          npm ci
          npm run api:types
      - name: Nessuna differenza con i file versionati
        run: |
          if ! git diff --exit-code -- openapi.json frontend/src/api/schema.d.ts; then
            echo "::error::Schema o tipi del client non aggiornati: esegui 'make api-types' e fai commit."
            exit 1
          fi
