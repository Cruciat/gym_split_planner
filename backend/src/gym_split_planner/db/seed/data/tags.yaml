  color: warning
  effect: penalty
  points: 3
  show_badge: true
- code: neck-avoid
  name: 'Collo: evitare'
  description: 'Esercizio da evitare per il collo: mai scelto automaticamente.'
  symbol: ban
  color: danger
  effect: exclude
  points: 0
  show_badge: true
