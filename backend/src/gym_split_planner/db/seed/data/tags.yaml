tags:
- code: neck-tip
  name: 'Collo: accorgimento'
  description: Esercizio adatto al collo a una condizione, scritta nella nota.
  symbol: info
  color: info
  effect: none
  points: 0
  show_badge: true
- code: neck-caution
  name: 'Collo: attenzione'
  description: 'Esercizio che può affaticare il collo: penalizzato, non escluso.'
