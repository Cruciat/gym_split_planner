# Dati iniziali di Gym Split Planner (docs/design/dati-iniziali.md).
# Caricati una sola volta, su database vuoto, al primo avvio. Riferimenti per `code`.
# Origine: banca_dati_esercizi.xlsx (ricerca), più famiglie, etichette e split nuovi
# decisi nel documento sui dati iniziali. Dopo il primo avvio il catalogo si modifica
# dall'app: questi file non vengono riletti.
#
# Stretching (dati iniziali, § 7.1) e mini-allenamento quotidiano (§ 7.3).

stretches:
- code: pec-doorway
  name: Stretch del petto allo stipite, braccio a 90° e braccio alto
  targets: Fascio medio e basso del petto, piccolo pettorale
  dose: 30 s, ripetuto fino a circa 60 s
- code: cross-body
  name: Braccio incrociato davanti al petto
  targets: Deltoide posteriore
  dose: 30 s × 3
- code: triceps-overhead
  name: Stretch del tricipite sopra la testa
  targets: Tricipite, capo lungo
  dose: 30 s, ripetuto fino a circa 60 s
- code: lat-kneeling
  name: Stretch del dorsale in ginocchio
  targets: Gran dorsale
  dose: 30 s, ripetuto fino a circa 60 s
- code: biceps-wall
  name: Stretch del bicipite a parete
  targets: Bicipite
  dose: 30 s, ripetuto fino a circa 60 s
- code: upper-trap
  name: Stretch del trapezio superiore
  targets: Trapezio superiore
  dose: 30 s per lato
- code: forearm-flexors
  name: Stretch dei flessori dell'avambraccio
  targets: Flessori del polso
  dose: 30 s
- code: hamstrings
  name: Stretch dei femorali
  targets: Femorali
  dose: 30 s
- code: hip-flexors-kneeling
  name: Stretch dei flessori dell'anca in ginocchio
  targets: Flessori dell'anca
  dose: 30 s per lato
- code: quads-standing
  name: Stretch del quadricipite in piedi
  targets: Quadricipite
  dose: 30 s per lato
- code: calf-wall
  name: Stretch del polpaccio al muro
  targets: Polpacci
  dose: 30 s per lato
daily_routine:
- block: neck
  position: 1
  name: Flessione cranio-cervicale da sdraiati (chin tuck)
  dose: 10 tenute da 10 s
  purpose: Controllo dei flessori profondi del collo
  confidence: limited
- block: neck
  position: 2
  name: Rotazione toracica a quattro zampe oppure open book
  dose: 8 per lato
  purpose: Mobilità toracica
  confidence: limited
- block: neck
  position: 3
  name: Y-raise da proni a terra, senza pesi, fronte su un asciugamano
  dose: 2 × 10
  purpose: Trapezio inferiore, controllo della scapola
  confidence: limited
- block: neck
  position: 4
  name: Stretch del trapezio superiore, spalla bassa
  dose: 2 × 30 s per lato
  purpose: Sollievo dalla tensione
  confidence: opinion
- block: pelvis
  position: 5
  name: Retroversione del bacino da sdraiati
  dose: 10 tenute da 5 s
  purpose: Controllo della posizione del bacino
  confidence: opinion
- block: pelvis
  position: 6
  name: Ponte per i glutei con bacino in retroversione
  dose: 2 × 12, 2 s di tenuta in alto
  purpose: Glutei e controllo del bacino
  confidence: limited
- block: pelvis
  position: 7
  name: Dead bug
  dose: 2 × 8 per lato
  purpose: Addominali e controllo del bacino
  confidence: limited
- block: pelvis
  position: 8
  name: Stretch dei flessori dell'anca in ginocchio, gluteo contratto
  dose: 2 × 30 s per lato
  purpose: Complemento, effetto piccolo e temporaneo
  confidence: limited
