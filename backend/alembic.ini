# Configurazione per l'uso di Alembic da riga di comando, nella cartella backend:
#   uv run alembic revision --autogenerate -m "descrizione"
#   uv run alembic upgrade head
# L'URL del database arriva da GSP_DATABASE_URL (vedi migrations/env.py).

[alembic]
script_location = src/gym_split_planner/db/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = src

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
